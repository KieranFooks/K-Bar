[package]
name = "battery-tray"
version = "0.1.0"
edition = "2021"
description = "Ultra-lightweight #![no_std] Win32 tray utility showing wireless peripheral battery levels"

[lib]
name = "battery_tray"
path = "src/lib.rs"

[[bin]]
name = "battery-tray"
path = "src/main.rs"
test = false

[[bin]]
name = "poc"
path = "src/bin/poc.rs"
test = false

[[bin]]
name = "glyphtest"
path = "src/bin/glyphtest.rs"
test = false

[dependencies]

[profile.dev]
panic = "abort"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

name: Release (CalVer)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional CalVer tag (e.g. v2026.11.22). Leave empty for today's UTC date."
        required: false
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-gnu

      - name: Expose MSYS2 binutils for windres
        run: |
          if (Test-Path "C:\msys64\mingw64\bin") {
            "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Resolve CalVer tag
        id: calver
        run: |
          $inputTag = "${{ inputs.tag }}".Trim()
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $tag = $env:GITHUB_REF_NAME
          } elseif ($inputTag -ne "") {
            $tag = if ($inputTag.StartsWith("v")) { $inputTag } else { "v$inputTag" }
          } else {
            git fetch --tags --quiet
            $base = "v" + (Get-Date).ToUniversalTime().ToString("yyyy.MM.dd")
            $existing = @(git tag -l "$base*")
            if ($existing -notcontains $base) {
              $tag = $base
            } else {
              $n = 1
              while ($existing -contains "$base.$n") { $n++ }
              $tag = "$base.$n"
            }
          }

          if ($tag -notmatch '^v\d{4}\.\d{2}\.\d{2}(\.\d+)?$') {
            throw "Tag '$tag' does not match CalVer format vYYYY.MM.DD[.N]"
          }

          $version = $tag.TrimStart('v')
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Resolved CalVer release: $tag ($version)"

      - name: Lint and unit tests
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo test --locked

      - name: Build portable .exe and verify PE
        id: build
        env:
          KATT_VERSION: ${{ steps.calver.outputs.version }}
        run: |
          cargo build --release --locked
          & "$PWD/tools/verify_portable.ps1" -Path "target\release\katt.exe" -ExpectedVersion "$env:KATT_VERSION"

          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target\release\katt.exe" "dist\katt.exe"
          $hash = (Get-FileHash "dist\katt.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  katt.exe" | Out-File -FilePath "dist\katt.exe.sha256" -Encoding ascii
          $sizeKb = [Math]::Round((Get-Item "dist\katt.exe").Length / 1024, 1)
          "size_kb=$sizeKb" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "sha256=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        continue-on-error: true
        with:
          subject-path: dist/katt.exe

      - name: Generate changelog and release notes
        run: |
          $tag = "${{ steps.calver.outputs.tag }}"
          $sizeKb = "${{ steps.build.outputs.size_kb }}"
          $sha256 = "${{ steps.build.outputs.sha256 }}"
          $repo = "${{ github.repository }}"

          $prevTag = ""
          $allTags = @(git tag --list "v*" --sort=-v:refname | Where-Object { $_ -ne $tag })
          foreach ($candidate in $allTags) {
            git merge-base --is-ancestor $candidate HEAD 2>$null
            if ($LASTEXITCODE -eq 0) {
              $prevTag = $candidate
              break
            }
          }

          $changelog = [System.Collections.Generic.List[string]]::new()
          $changelog.Add("## Changelog")
          $changelog.Add("")

          if ($prevTag -eq "") {
            $changelog.Add("- Initial portable Windows 11 release (``$tag``): wireless battery taskbar indicator for Bluetooth PnP, Logitech, Razer, HyperX, SteelSeries, and Corsair peripherals.")
            $changelog.Add("")
          } else {
            $rawCommits = @(git log "$prevTag..HEAD" --no-merges --format="%h`t%s")

            $features = [System.Collections.Generic.List[string]]::new()
            $fixes = [System.Collections.Generic.List[string]]::new()
            $maintenance = [System.Collections.Generic.List[string]]::new()
            $other = [System.Collections.Generic.List[string]]::new()

            foreach ($line in $rawCommits) {
              if ([string]::IsNullOrWhiteSpace($line)) { continue }
              $parts = $line -split "`t", 2
              $sha = $parts[0]
              $msg = $parts[1]
              $entry = "- $msg (``$sha``)"
              if ($msg -match '^feat(\([^)]+\))?(!)?:\s*') {
                $features.Add($entry)
              } elseif ($msg -match '^fix(\([^)]+\))?(!)?:\s*') {
                $fixes.Add($entry)
              } elseif ($msg -match '^(docs|ci|build|chore)(\([^)]+\))?(!)?:\s*') {
                $maintenance.Add($entry)
              } else {
                $other.Add($entry)
              }
            }

            if ($features.Count -gt 0) {
              $changelog.Add("### Features")
              $features | ForEach-Object { $changelog.Add($_) }
              $changelog.Add("")
            }
            if ($fixes.Count -gt 0) {
              $changelog.Add("### Fixes")
              $fixes | ForEach-Object { $changelog.Add($_) }
              $changelog.Add("")
            }
            if ($other.Count -gt 0) {
              $changelog.Add("### Changes")
              $other | ForEach-Object { $changelog.Add($_) }
              $changelog.Add("")
            }
            if ($maintenance.Count -gt 0) {
              $changelog.Add("### Docs & CI")
              $maintenance | ForEach-Object { $changelog.Add($_) }
              $changelog.Add("")
            }
            if ($rawCommits.Count -eq 0) {
              $changelog.Add("_No code changes since $prevTag._")
              $changelog.Add("")
            }
            $changelog.Add("**Full Changelog**: https://github.com/$repo/compare/$prevTag...$tag")
            $changelog.Add("")
          }

          $header = @'
          ### Portable Windows 11 Build (`__TAG__`, ~__SIZE_KB__ KB)

          1. Download **`katt.exe`** below.
          2. Double-click to run directly (no installer, no archive, zero external dependencies).
             *(If Windows SmartScreen prompts on first launch of an unsigned binary, click **More info → Run anyway**.)*

          #### Optional: Install / Update & Run at Windows Startup (PowerShell)
          ```powershell
          $dir = "$env:LOCALAPPDATA\Programs\katt"
          $dst = "$dir\katt.exe"
          Stop-Process -Name katt, katt-dev -ErrorAction SilentlyContinue
          Start-Sleep -Milliseconds 300
          New-Item -ItemType Directory -Force $dir | Out-Null
          Remove-Item "$dir\katt.exe.old", "$dir\katt.exe.new", "$dir\katt-dev.exe" -Force -ErrorAction SilentlyContinue
          Invoke-WebRequest "https://github.com/__REPO__/releases/download/__TAG__/katt.exe" -OutFile $dst
          Unblock-File $dst
          Set-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run" -Name "katt" -Value "`"$dst`""
          Start-Process $dst
          ```

          #### Stop & Clean Up / Uninstall (PowerShell)
          ```powershell
          Stop-Process -Name katt, katt-dev -ErrorAction SilentlyContinue
          Start-Sleep -Milliseconds 300
          Remove-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run" -Name "katt" -ErrorAction SilentlyContinue
          Remove-Item "HKCU:\Software\katt" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "$env:LOCALAPPDATA\Programs\katt" -Recurse -Force -ErrorAction SilentlyContinue
          ```

          **SHA-256 (`katt.exe`):** `__SHA256__`

          ---

          '@
          $header = $header.Replace("__TAG__", $tag).Replace("__SIZE_KB__", $sizeKb).Replace("__REPO__", $repo).Replace("__SHA256__", $sha256)
          $fullBody = $header + ($changelog -join "`n")
          $fullBody | Out-File -FilePath "dist\release_body.md" -Encoding utf8

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.calver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: katt ${{ steps.calver.outputs.tag }}
          body_path: dist/release_body.md
          files: |
            dist/katt.exe
            dist/katt.exe.sha256
